name: release

# The title is built locally; tools/publish-release.sh packages dist/ and
# creates the release with the ZIP attached. This workflow only covers the
# case where a version tag is pushed without the script: it creates the
# release with the friendly notes, and the script (or a manual upload) adds
# the package afterwards.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Release notes
        run: bash tools/release-notes.sh "$TAG" > release-notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "RetroArch for PlayStation 5 $TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "RetroArch for PlayStation 5 $TAG" \
              --notes-file release-notes.md
          fi
